services:
  mysql:
    image: mysql:8.0
    container_name: task_manager_mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: task_manager

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_manager_app

    restart: on-failure

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      # Overrides whatever DB_HOST is set to in .env: inside the compose
      # network the database is reachable at the "mysql" service name,
      # not localhost/127.0.0.1.
      DB_HOST: mysql
      PORT: "3000"

    volumes:
      # The app still loads its config via godotenv (see
      # initializers/LoadEnvVariables.go), so the local .env file is
      # mounted read-only instead of being copied into the image.
      - ./.env:/app/.env:ro

    ports:
      - "3000:3000"

volumes:
  mysql_data:
